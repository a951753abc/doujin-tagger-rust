[package]
name = "doujin-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
axum = "0.8.9"
doujin-app = { path = "../doujin-app" }
doujin-files = { path = "../doujin-files" }
doujin-parser = { path = "../doujin-parser" }
doujin-provider-dlsite = { path = "../doujin-provider-dlsite" }
doujin-provider-ehentai = { path = "../doujin-provider-ehentai" }
doujin-scanner = { path = "../doujin-scanner" }
doujin-storage = { path = "../doujin-storage" }
doujin-thumbnails = { path = "../doujin-thumbnails" }
form_urlencoded = "1.2.2"
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "webp"] }
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"
