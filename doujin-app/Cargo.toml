[package]
name = "doujin-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
doujin-files = { path = "../doujin-files" }
doujin-parser = { path = "../doujin-parser" }
doujin-scanner = { path = "../doujin-scanner" }
doujin-storage = { path = "../doujin-storage" }
doujin-thumbnails = { path = "../doujin-thumbnails" }
fs2 = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
zip = { version = "8.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"
