[package]
name = "doujin-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
doujin-files = { path = "../doujin-files" }
doujin-parser = { path = "../doujin-parser" }
doujin-scanner = { path = "../doujin-scanner" }
doujin-storage = { path = "../doujin-storage" }
doujin-thumbnails = { path = "../doujin-thumbnails" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
