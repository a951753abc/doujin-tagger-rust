[package]
name = "doujin-provider-ehentai"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
doujin-app = { path = "../doujin-app" }
doujin-parser = { path = "../doujin-parser" }
doujin-storage = { path = "../doujin-storage" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "query", "rustls"] }
scraper = "0.24.0"
serde_json = "1.0.151"

[lints.rust]
unsafe_code = "forbid"
