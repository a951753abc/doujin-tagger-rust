[package]
name = "doujin-desktop"
version = "0.1.9"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "doujin_desktop"
path = "src/lib.rs"

[[bin]]
name = "doujin-desktop"
path = "src/main.rs"

[dependencies]
doujin-http = { path = "../doujin-http" }
doujin-launcher = { path = "../doujin-launcher" }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints.rust]
unsafe_code = "forbid"
